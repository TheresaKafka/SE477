<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - PhongTro Owner</title>
  <link rel="stylesheet" href="owner.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap { width: 100%; max-width: 400px; padding: 20px; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: var(--shadow);
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .icon { font-size: 40px; margin-bottom: 8px; }
    .login-logo h1 { font-size: 22px; font-weight: 800; color: var(--white); }
    .login-logo p  { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .badge-owner {
      display: inline-block;
      background: rgba(99,102,241,.2);
      color: var(--accent-lt);
      border: 1px solid rgba(99,102,241,.3);
      padding: 4px 14px; border-radius: 99px;
      font-size: 12px; font-weight: 700;
      margin-bottom: 16px;
    }
    .btn-login {
      width: 100%; padding: 12px;
      background: var(--accent); color: white;
      border: none; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: var(--transition);
      font-family: var(--font);
    }
    .btn-login:hover { background: #5254cc; }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim); }
    .login-footer a { color: var(--accent-lt); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🏢</div>
        <div class="badge-owner">OWNER PORTAL</div>
        <h1>PhongTro Manager</h1>
        <p>Đăng nhập bằng tài khoản chủ trọ</p>
      </div>

      <div id="alertBox"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="email" type="email" placeholder="owner@phongtro.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••">
      </div>

      <button class="btn-login" id="btnLogin" onclick="doLogin()">Đăng nhập</button>

      <div class="login-footer">
        Bạn là khách thuê? <a href="../user-app/home.html">Vào trang tìm phòng →</a>
      </div>
    </div>
  </div>

  <script src="owner-api.js"></script>
  <script>
    // Redirect if already logged in as owner
    const user = OwnerApi.getUser();
    if (user?.role === 'OWNER') window.location.href = 'dashboard.html';

    function showAlert(msg, type = 'error') {
      document.getElementById('alertBox').innerHTML =
        `<div class="alert alert-${type}">${msg}</div>`;
    }

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showAlert('Vui lòng nhập đầy đủ thông tin');

      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';

      try {
        const data = await OwnerApi.login(email, password);
        localStorage.setItem('owner_token', data.access_token);
        localStorage.setItem('owner_user', JSON.stringify(data.user));
        showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (e) {
        showAlert(e.message);
        btn.disabled = false; btn.textContent = 'Đăng nhập';
      }
    }

    // Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
